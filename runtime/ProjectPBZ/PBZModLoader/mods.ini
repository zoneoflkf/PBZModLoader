[Loader]
Enabled=1
Version=1
; Total evidence directory budget in MiB (120-4096).
LogDirectoryLimitMiB=2048
; Number of ordinary runs to keep, including this run. 0 disables loader.log.
LogRetentionRuns=10

; Automatically loads mods/<id>/main.js in ID order on each launch.
; Add an ID below with value 0 to disable it; remove the line or use 1 to enable.
[Mods]
; your-mod-id=0
